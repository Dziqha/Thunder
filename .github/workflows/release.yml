name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags "-X github.com/Dziqha/Thunder/internal/cli.version=${GITHUB_REF_NAME}" -o dist/thunder-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/thunder

      - name: Generate checksum
        run: |
          cd dist
          sha256sum * > SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunder-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact directories
        run: |
          find dist -type f -exec cp {} . \;

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            thunder-*
            SHA256SUMS-*.txt
